<div class="editpostModal">
	<div class="text-div">
	  <h2>Edit your post</h2>
	  <p>Title:</p>
	  <input id="postTitle" type="text" ng-model="post.title" />
	  <p>Summary:</p>
	  <input id="postSummary" type="text" ng-model="post.summary" />
	</div>
	<div class="post-thumbnailDiv">
	  <p>Thumbnail:</p>
	  <input
		type="text"
		ng-model="post.post_thumbnail"
		placeholder="Insira uma URL"
	  />
	</div>
	<div>
	  <p>Text:</p>
	  <textarea
		id="postText"
		placeholder="tell your story..."
		ng-model="post.text"
	  ></textarea>
	</div>
	<div class="postButtonDiv">
	  <button ng-click="editPost()">Publish</button>
	  <button ng-click="closePostModal()">Cancel</button>
	</div>
</div>
