<div class="login-formDiv">
	<form class="doca-form">
		<div class="form-fields">
			<div class="form-group">
				<h4>Register Account.</h4>
				<p>Your Email</p>
				<input type="email" ng-model="user.email">
			</div>
			<div class="form-group">
				<p>Your Name</p>
				<input type="text" ng-model="user.name">
			</div>
			<div class="form-group">
				<p>Your Password</p>
				<input type="password" ng-model="user.password">
			</div>
			<div class="form-group">
				<p>Confirm Password</p>
				<input type="password">
			</div>
		</div>
		<div class="form-session">
			<div class="continueButton-div">
				<button class="continueButton" ng-disabled="!user.email && !user.password" ng-click="registerUser()"> Continue </button>
			</div>
			<div class="form-session-link">
				<p>Already have an account? <a ui-sref="login"> Login </a></p>
			</div>
		</div>
	</form>
	</div>
</div>
