<div class="doca" ng-repeat="post in posts">
  <div class="doca doca-card">
    <div class="doca doca-card__content">
      <pre>{{post.user.name}}</pre>
      <p class="doca-card__title">{{ post.title }}</p>
      <p class="doca-card__subtitle">{{ post.summary }}</p>
      <p class="doca-card__subtitle">{{post.createdAt | formatDate}}</p>
    </div>
  </div>
</div>
